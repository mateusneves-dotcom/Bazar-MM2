<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazar — Catálogo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --paper:#F6F0DE;
  --paper-dark:#EBE0C4;
  --ink:#1E2B27;
  --ink-soft:#4C6058;
  --teal:#163832;
  --teal-mid:#2F7D4F;
  --teal-deep:#0E2420;
  --mustard:#E8A93B;
  --mustard-deep:#C98A1F;
  --stamp:#A6362C;
  --thread:#C9BFA0;
  --shadow:rgba(14,36,32,0.22);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
.mono{font-family:'JetBrains Mono',monospace;}
.display{font-family:'Fraunces',serif;}

#app{max-width:1080px;margin:0 auto;padding:0 18px 60px;}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 0 16px;
  border-bottom:3px solid var(--teal);
  box-shadow:0 3px 0 -2px var(--mustard);
  margin-bottom:26px;
  gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.crest-badge{flex:none;width:46px;height:52px;filter:drop-shadow(0 2px 3px var(--shadow));}
.brand h1{
  font-family:'Fraunces',serif;font-weight:700;font-size:clamp(20px,3.4vw,27px);
  margin:0;color:var(--paper);letter-spacing:0.03em;
  background:var(--teal-deep);
  padding:5px 16px 6px;border-radius:3px;
  border-top:2px solid var(--mustard);border-bottom:2px solid var(--mustard);
  display:inline-block;
}
.brand .sub{
  font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;
  margin-top:6px;display:flex;align-items:center;gap:6px;
}
.brand .sub::before,.brand .sub::after{content:'';width:14px;height:1.5px;background:var(--mustard-deep);flex:none;}
.view-toggle{display:flex;gap:6px;background:var(--paper-dark);padding:4px;border-radius:999px;}
.view-toggle button{
  border:1.5px solid transparent;background:transparent;padding:9px 18px;border-radius:999px;
  font-weight:600;font-size:14px;color:var(--ink-soft);transition:background .2s,color .2s;
}
.view-toggle button.active{background:var(--teal);color:var(--paper);border-color:var(--mustard-deep);}
.view-toggle button:focus-visible{outline:2px solid var(--mustard);outline-offset:2px;}

/* ---------- loja ---------- */
.hint{font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}
.hint strong{color:var(--teal);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.chip{
  border:1.5px solid var(--thread);background:transparent;color:var(--ink-soft);
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:all .15s;
}
.chip svg{width:14px;height:14px;}
.chip.active,.chip:hover{background:var(--teal);color:var(--paper);border-color:var(--mustard-deep);}
.chip:focus-visible{outline:2px solid var(--mustard);outline-offset:2px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;}
.card{
  position:relative;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 3px 10px var(--shadow);border:1px solid var(--paper-dark);
  display:flex;flex-direction:column;transition:transform .15s;
}
.card:hover{transform:translateY(-3px);}
.card .img{width:100%;aspect-ratio:1/1;background:var(--paper-dark);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.card .img img{width:100%;height:100%;object-fit:cover;}
.card .img svg{width:38%;height:38%;color:var(--thread);}
.card .info{padding:12px 13px 14px;display:flex;flex-direction:column;gap:4px;flex:1;}
.card .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--mustard-deep);font-weight:700;}
.card .name{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;color:var(--teal);line-height:1.25;}
.card .bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:6px;}
.card .price{font-weight:700;font-size:15px;color:var(--ink);}
.card .stock{font-size:11.5px;color:var(--ink-soft);}
.card .stock.low{color:var(--stamp);font-weight:600;}

.stamp{
  position:absolute;top:14px;right:-30px;width:130px;text-align:center;
  transform:rotate(18deg);border:2.5px solid var(--stamp);color:var(--stamp);
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.1em;
  padding:4px 0;text-transform:uppercase;background:rgba(255,255,255,0.55);
  mix-blend-mode:multiply;border-radius:3px;pointer-events:none;
}

.empty{
  text-align:center;padding:70px 20px;color:var(--ink-soft);border:2px dashed var(--thread);border-radius:12px;
}
.empty .display{font-size:20px;color:var(--teal);margin-bottom:8px;}
.empty button{margin-top:16px;background:var(--teal);color:var(--paper);border:none;padding:10px 20px;border-radius:8px;font-weight:600;}

/* ---------- pin gate ---------- */
.pin-wrap{display:flex;flex-direction:column;align-items:center;padding:60px 20px;}
.pin-wrap h2{font-family:'Fraunces',serif;color:var(--teal);margin-bottom:6px;}
.pin-wrap p{color:var(--ink-soft);font-size:13px;margin-top:0;margin-bottom:24px;}
.pin-dots{display:flex;gap:12px;margin-bottom:26px;}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--teal);}
.pin-dots span.filled{background:var(--teal);}
.pin-error{color:var(--stamp);font-size:13px;margin-top:-14px;margin-bottom:18px;font-weight:600;}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:12px;}
.pad button{
  width:64px;height:64px;border-radius:50%;border:1.5px solid var(--thread);background:#fff;
  font-size:20px;font-weight:600;color:var(--teal);
}
.pad button:active{background:var(--paper-dark);}
.pad button.wide{grid-column:span 1;font-size:14px;color:var(--ink-soft);border:none;background:transparent;}

/* ---------- abertura de caixa ---------- */
.open-box{max-width:360px;margin:40px auto;text-align:center;background:#fff;border:1px solid var(--paper-dark);border-radius:12px;padding:32px 26px;box-shadow:0 3px 10px var(--shadow);}
.open-box h2{font-family:'Fraunces',serif;color:var(--teal);margin-top:0;}
.open-box label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin-bottom:6px;text-align:left;}
.open-box input{width:100%;padding:12px;border-radius:8px;border:1.5px solid var(--thread);font-size:16px;margin-bottom:18px;}
.open-box button{width:100%;background:var(--teal);color:var(--paper);border:none;padding:13px;border-radius:8px;font-weight:700;font-size:15px;}

/* ---------- caixa dashboard ---------- */
.summary-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.summary-item{background:var(--teal);color:var(--paper);padding:14px 18px;border-radius:10px;min-width:140px;flex:1;}
.summary-item .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.75;margin-bottom:4px;}
.summary-item .val{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;}
.close-btn{background:transparent;border:1.5px solid var(--stamp);color:var(--stamp);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap;}
.hist-btn{background:transparent;border:1.5px solid var(--teal);color:var(--teal);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap;}

.method-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px;}
.method-breakdown div{background:#fff;border:1px solid var(--paper-dark);border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;font-size:13.5px;}

.hist-card{background:#fff;border:1px solid var(--paper-dark);border-radius:10px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 6px var(--shadow);}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.hist-date{font-family:'Fraunces',serif;font-weight:600;color:var(--teal);font-size:16px;}
.hist-sub{font-size:12px;color:var(--ink-soft);}
.hist-stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-soft);}
.hist-stats strong{color:var(--ink);}

.method-row{display:flex;gap:8px;margin-bottom:16px;}
.method-row button{
  flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--thread);background:#fff;color:var(--ink-soft);font-weight:600;font-size:13px;
}
.method-row button.active{background:var(--mustard);border-color:var(--mustard-deep);color:var(--teal-deep);}

.circulo-row{display:flex;gap:8px;margin-bottom:16px;}
.circulo-row button{
  flex:1;padding:10px 6px;border-radius:8px;border:2px solid var(--thread);background:#fff;color:var(--ink-soft);
  font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.circulo-row button .dot{width:11px;height:11px;border-radius:50%;flex:none;}
.circulo-row button.active{background:var(--paper-dark);color:var(--ink);}
.circulo-row button.active .dot{box-shadow:0 0 0 2px #fff, 0 0 0 3.5px currentColor;}
.circulo-hint{font-size:12px;color:var(--ink-soft);margin:-6px 0 14px;}

.ranking-panel{background:#fff;border:1px solid var(--paper-dark);border-radius:12px;padding:16px 18px;margin-bottom:20px;box-shadow:0 3px 10px var(--shadow);}
.ranking-panel h3{font-family:'Fraunces',serif;color:var(--teal);margin:0 0 12px;font-size:17px;}
.ranking-list{display:flex;flex-direction:column;gap:8px;}
.ranking-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--paper);}
.ranking-row .pos{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--ink-soft);width:20px;}
.ranking-row .dot{width:13px;height:13px;border-radius:50%;flex:none;}
.ranking-row .nm{font-weight:700;font-size:13.5px;flex:1;}
.ranking-row .val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13.5px;}
.ranking-row .qtd{font-size:11px;color:var(--ink-soft);}
.ranking-row.leader{background:linear-gradient(90deg, rgba(232,169,59,0.22), rgba(232,169,59,0.04));}

.comanda-card{background:#fff;border:1px solid var(--paper-dark);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 10px var(--shadow);}
.comanda-card .cc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
.comanda-card .cc-name{font-family:'Fraunces',serif;font-size:18px;color:var(--teal);}
.comanda-item-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--thread);font-size:13.5px;}
.comanda-item-row .ci-name{flex:1;}
.comanda-item-row button{background:none;border:none;color:var(--stamp);font-weight:700;cursor:pointer;}
.comanda-total-row{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;margin-top:4px;}
.comanda-actions{display:flex;gap:8px;margin-top:12px;}
.comanda-actions button{flex:1;padding:9px;border-radius:8px;font-weight:700;font-size:13px;border:1.5px solid var(--thread);background:#fff;}
.comanda-actions .cc-add{color:var(--teal);}
.comanda-actions .cc-close{background:var(--teal);color:#fff;border-color:var(--teal);}
.comanda-actions .cc-del{color:var(--stamp);flex:0.5;}
.new-comanda-row{display:flex;gap:8px;margin-bottom:20px;}
.new-comanda-row input{flex:1;padding:10px 12px;border-radius:8px;border:1.5px solid var(--thread);font-size:14px;}
.new-comanda-row button{padding:10px 16px;border-radius:8px;border:none;background:var(--teal);color:#fff;font-weight:700;}

.caixa-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start;}
@media (max-width:820px){.caixa-cols{grid-template-columns:1fr;}}

.sell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.sell-card{background:#fff;border:1px solid var(--paper-dark);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 6px var(--shadow);}
.sell-card .thumb{width:100%;aspect-ratio:1/1;border-radius:6px;background:var(--paper-dark);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.sell-card .thumb img{width:100%;height:100%;object-fit:cover;}
.sell-card .thumb svg{width:34%;height:34%;color:var(--thread);}
.sell-card .nm{font-weight:600;font-size:13px;line-height:1.25;}
.sell-card .pr{font-family:'JetBrains Mono',monospace;font-size:13px;}
.sell-card .qtybadge{align-self:flex-start;font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--paper-dark);color:var(--ink-soft);font-weight:700;}
.sell-card .qtybadge.zero{background:var(--stamp);color:#fff;}
.sell-card button.vender{background:var(--teal);color:var(--paper);border:none;border-top:2px solid var(--mustard);padding:7px 8px;border-radius:6px;font-weight:700;font-size:12.5px;}
.sell-card button.vender:disabled{background:var(--thread);color:#fff;cursor:not-allowed;}

.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--paper-dark);border-radius:6px;padding:4px 6px;}
.stepper button{width:24px;height:24px;border-radius:5px;border:none;background:#fff;color:var(--teal);font-weight:700;font-size:14px;line-height:1;}
.stepper button:disabled{opacity:0.4;cursor:not-allowed;}
.stepper span{font-size:13px;font-weight:700;min-width:16px;text-align:center;}

.cart-panel{background:#fff;border:1.5px dashed var(--mustard-deep);border-radius:10px;padding:14px 16px;margin-top:16px;}
.cart-line{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--paper-dark);}
.cart-line .cl-name{flex:1;font-size:13px;}
.cart-line .cl-price{font-size:12.5px;color:var(--ink-soft);}
.cart-line button{border:none;background:transparent;color:var(--stamp);font-size:13px;padding:2px 4px;}
.cart-total{display:flex;justify-content:space-between;font-weight:700;padding:10px 0 4px;font-size:14.5px;}
.finalize-btn{width:100%;background:var(--mustard);color:var(--teal-deep);border:none;padding:12px;border-radius:8px;font-weight:700;font-size:14px;margin-top:8px;}

.receipt{
  background:#fff;border-radius:4px;padding:18px 16px;box-shadow:0 4px 14px var(--shadow);
  transform:rotate(-0.6deg);position:relative;
  background-image:repeating-linear-gradient(to bottom, transparent 0 27px, var(--paper-dark) 27px 28px);
}
.receipt h3{font-family:'JetBrains Mono',monospace;font-size:14px;text-align:center;margin:0 0 12px;letter-spacing:0.06em;color:var(--teal);}
.receipt .line{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--paper-dark);gap:8px;}
.receipt .line .l{flex:1;color:var(--ink);}
.receipt .line .r{color:var(--ink-soft);white-space:nowrap;}
.receipt .empty-r{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:20px 0;font-family:'JetBrains Mono',monospace;}
.receipt .undo{display:block;margin:12px auto 0;background:transparent;border:1px solid var(--thread);color:var(--ink-soft);font-size:11.5px;padding:6px 12px;border-radius:6px;}
.receipt-list{max-height:260px;overflow-y:auto;}

/* ---------- manage products ---------- */
.manage{margin-top:30px;}
.manage h2{font-family:'Fraunces',serif;color:var(--teal);font-size:20px;border-top:2px solid var(--thread);padding-top:24px;}
.manage-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.manage-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--paper-dark);border-radius:8px;padding:8px 10px;}
.manage-row .mthumb{width:40px;height:40px;border-radius:6px;background:var(--paper-dark);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.manage-row .mthumb img{width:100%;height:100%;object-fit:cover;}
.manage-row .mthumb svg{width:55%;height:55%;color:var(--thread);}
.manage-row .minfo{flex:1;min-width:0;}
.manage-row .minfo .n{font-weight:600;font-size:13.5px;}
.manage-row .minfo .m{font-size:11.5px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
.manage-row button{border:none;background:var(--paper-dark);color:var(--ink-soft);width:30px;height:30px;border-radius:6px;font-size:13px;}
.manage-row button.del{color:var(--stamp);}
.manage-row button.del.confirm{background:var(--stamp);color:#fff;}
.add-btn{background:var(--mustard);color:var(--teal-deep);border:none;padding:11px 18px;border-radius:8px;font-weight:700;font-size:13.5px;}

.modal-bg{position:fixed;inset:0;background:rgba(14,36,32,0.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:var(--paper);border-radius:12px;padding:26px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;}
.modal h2{font-family:'Fraunces',serif;color:var(--teal);margin-top:0;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select{width:100%;padding:10px;border-radius:7px;border:1.5px solid var(--thread);font-size:14px;background:#fff;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.photo-preview{width:90px;height:90px;border-radius:8px;background:var(--paper-dark);overflow:hidden;margin-bottom:8px;display:flex;align-items:center;justify-content:center;}
.photo-preview img{width:100%;height:100%;object-fit:cover;}
.photo-preview svg{width:40%;height:40%;color:var(--thread);}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions button{flex:1;padding:12px;border-radius:8px;font-weight:700;font-size:14px;border:none;}
.btn-save{background:var(--teal);color:var(--paper);border-top:2px solid var(--mustard);}
.btn-cancel{background:var(--paper-dark);color:var(--ink-soft);}

/* ---------- página cheia de produto ---------- */
.product-page{padding-top:6px;}
.back-btn{background:none;border:none;color:var(--ink-soft);font-size:13.5px;font-weight:600;padding:0;margin-bottom:16px;}
.back-btn:hover{color:var(--teal);}
.product-page h2{margin-top:0;margin-bottom:22px;color:var(--teal);}
.pp-layout{display:grid;grid-template-columns:200px 1fr;gap:28px;background:#fff;border:1px solid var(--paper-dark);border-radius:12px;padding:26px;box-shadow:0 3px 10px var(--shadow);}
@media (max-width:600px){.pp-layout{grid-template-columns:1fr;}}
.pp-photo{display:flex;flex-direction:column;align-items:flex-start;gap:10px;}
.photo-preview.big{width:100%;aspect-ratio:1/1;border-radius:10px;}
.pp-fields{display:flex;flex-direction:column;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--teal);color:var(--paper);padding:11px 20px;border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px var(--shadow);z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}

.loading{text-align:center;padding:80px 20px;color:var(--ink-soft);font-family:'Fraunces',serif;font-size:18px;}

/* ---------- carrinho do cliente / checkout ---------- */
.card .addrow{display:flex;align-items:center;gap:6px;margin-top:8px;}
.card .addrow .stepper{flex:none;}
.card .addrow button.addbtn{flex:1;background:var(--teal);color:var(--paper);border:none;padding:8px;border-radius:6px;font-weight:700;font-size:12px;}
.card .addrow button.addbtn:disabled{background:var(--thread);cursor:not-allowed;}

.floatbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:40;
  background:var(--teal);color:var(--paper);border-radius:999px;padding:12px 20px;
  display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px var(--shadow);cursor:pointer;
  max-width:calc(100% - 32px);}
.floatbar .fb-count{background:var(--mustard);color:var(--teal-deep);border-radius:50%;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;}
.floatbar .fb-total{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}
.floatbar .fb-lbl{font-size:13px;font-weight:600;}

.pay-methods{display:flex;gap:10px;margin-bottom:18px;}
.pay-methods button{flex:1;padding:14px 8px;border-radius:10px;border:1.5px solid var(--thread);background:#fff;
  font-weight:700;font-size:13.5px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:6px;}
.pay-methods button svg{width:22px;height:22px;}

async function loadStore(){
  try{
    const { data, error } = await sb.from('bazar_store').select('data').eq('id', STORE_ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data){
      const parsed = data.data;
      if(!parsed.settings) parsed.settings = {name:'MM'};
      if(parsed.settings.name === 'Meu Bazar') parsed.settings.name = 'MM';
      if(!parsed.history) parsed.history = [];
      if(!parsed.orders) parsed.orders = [];
      if(!parsed.comandas) parsed.comandas = [];
      return parsed;
    }
  }catch(e){ console.error('loadStore', e); }
  // primeira vez: cria a linha no Supabase com os dados padrão
  const initial = defaultStore();
  try{
    await sb.from('bazar_store').upsert({ id: STORE_ROW_ID, data: initial });
  }catch(e){ console.error('loadStore/seed', e); }
  return initial;
}
async function saveStore(){
  try{
    const { error } = await sb.from('bazar_store')
      .upsert({ id: STORE_ROW_ID, data: store, updated_at: new Date().toISOString() });

function brl(n){ return 'R$ ' + (Number(n)||0).toFixed(2).replace('.',','); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------- avisos para o dono (novo pedido / pagamento confirmado) ---------------- */
function playNotifyBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    [0, 0.18].forEach(delay=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + delay + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.32);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + 0.35);
    });
  }catch(e){ /* áudio bloqueado pelo navegador, sem problema */ }
}
function notifyOwner(title, body){
  toast(`${title}${body ? ' — '+body : ''}`);
  playNotifyBeep();
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification(title, { body, tag: 'bazar-mm-'+Date.now() });
    }
  }catch(e){ /* ambiente sem suporte a notificação do sistema */ }
}

function renderLoja(){

      <button data-action="goCaixa">Ir para Caixa</button>

    gridHtml = `<div class="grid">${visible.map(p=>{

      const img = p.image ? `<div class="img"><img src="${p.image}" alt="${p.name}"></div>` : placeholderIcon(p.category);
      const inCart = custCart.find(c=>c.productId===p.id);
      const already = inCart ? inCart.qty : 0;
      const remaining = p.qty - already;
      const dq = custDraftQty[p.id] || 1;
      return `<div class="card">
        ${img}
        ${soldOut ? `<div class="stamp">Esgotado</div>` : ''}
        <div class="info">
          <div class="cat">${catInfo(p.category).label}</div>
          <div class="name">${p.name}</div>
          <div class="bottom">
            <div class="price">${brl(p.price)}</div>
            <div class="stock ${p.qty<=2 && !soldOut ? 'low':''}">${soldOut ? '' : (p.qty===1 ? 'Última unidade' : 'Restam '+p.qty)}</div>
          </div>
          ${soldOut ? '' : `
          <div class="addrow">
            <div class="stepper">
              <button data-action="custDec" data-id="${p.id}" ${dq<=1?'disabled':''}>−</button>
              <span>${dq}</span>
              <button data-action="custInc" data-id="${p.id}" ${dq>=remaining?'disabled':''}>+</button>
            </div>
            <button class="addbtn" data-action="custAdd" data-id="${p.id}" ${remaining<=0?'disabled':''}>Adicionar</button>
          </div>`}
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  const custCount = custCart.reduce((a,c)=>a+c.qty,0);
  const custTotal = custCart.reduce((a,c)=>a+c.qty*c.price,0);

  root.innerHTML = `
    ${store.products.length ? `<div class="chips">${chips}</div>` : ''}

    <div class="floatbar" data-action="openCart">
      <span class="fb-count">${custCount}</span>
      <span class="fb-lbl">Ver pedido</span>
      <span class="fb-total">${brl(custTotal)}</span>
    </div>` : ''}
  `;
}

/* ---------------- CAIXA: dashboard ---------------- */
function sessionSales(){

function renderCaixaDashboard(){

  const saldoCaixa = (store.register.trocoInicial||0) + totalDinheiro;

  const sellCards = store.products.map(p=>{
    const zero = p.qty<=0;
    const inCart = cart.find(c=>c.productId===p.id);

      <div class="pr">${brl(p.price)}</div>

  }).join('') || `<p class="hint">Nenhum produto cadastrado ainda. Adicione abaixo em "Gerenciar produtos".</p>`;

  const cartTotal = cart.reduce((a,c)=>a+c.price*c.qty,0);
  const cartHtml = `
    <div class="cart-panel">
      <h3 class="mono" style="margin:0 0 10px;font-size:13px;color:var(--teal);letter-spacing:0.05em;text-transform:uppercase;">Venda atual</h3>

  const pendingOrders = (store.orders||[]).filter(o=>o.status==='pendente');

/* ---------------- fechamento / histórico / pdf ---------------- */
function buildSummary(salesList, trocoInicial, openedAt, closedAt){
  const totalVendido = salesList.reduce((a,s)=>a+s.price*s.qty,0);
  const qtdVendida = salesList.reduce((a,s)=>a+s.qty,0);
  const porMetodo = {dinheiro:0, cartao:0, pix:0, credito:0, debito:0};
  salesList.forEach(s=>{ porMetodo[s.method] = (porMetodo[s.method]||0) + s.price*s.qty; });
  const saldoCaixa = (trocoInicial||0) + porMetodo.dinheiro;

  const catMap = {};
  salesList.forEach(s=>{
    const catId = s.category || (store.products.find(p=>p.id===s.productId)||{}).category || 'outros';
    if(!catMap[catId]) catMap[catId] = {qty:0, total:0};
    catMap[catId].qty += s.qty;
    catMap[catId].total += s.price*s.qty;
  });
  const porCategoria = Object.entries(catMap)
    .map(([id, v])=>({id, label:catInfo(id).label, qty:v.qty, total:v.total}))
    .sort((a,b)=>b.total-a.total);

  return {
    dateLabel: new Date(openedAt||Date.now()).toLocaleDateString('pt-BR'),
    openedAt, closedAt,
    trocoInicial: trocoInicial||0,
    totalVendido, qtdVendida, porMetodo, porCategoria, saldoCaixa,
    sales: salesList
  };
}

function generatePdf(summary){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const marginX = 16;
    let y = 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(`${store.settings.name||'MM'} — Fechamento de caixa`, marginX, y); y+=8;
    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    doc.text(`Data: ${summary.dateLabel}`, marginX, y); y+=8;
    doc.text(`Troco inicial: ${brl(summary.trocoInicial)}`, marginX, y); y+=6;
    doc.text(`Total vendido: ${brl(summary.totalVendido)}`, marginX, y); y+=6;
    doc.text(`Itens vendidos: ${summary.qtdVendida}`, marginX, y); y+=6;
    doc.text(`Saldo em caixa: ${brl(summary.saldoCaixa)}`, marginX, y); y+=10;
    doc.setFont('helvetica','bold'); doc.text('Por forma de pagamento', marginX, y); y+=7;
    doc.setFont('helvetica','normal');
    Object.entries(summary.porMetodo).forEach(([k,v])=>{
      doc.text(`${METHOD_LABELS[k]||k}: ${brl(v)}`, marginX, y); y+=6;
    });
    y+=4;
    doc.setFont('helvetica','bold'); doc.text('Por categoria', marginX, y); y+=7;
    doc.setFont('helvetica','normal');
    const cats = summary.porCategoria || [];
    if(!cats.length){ doc.text('Nenhuma venda registrada.', marginX, y); y+=6; }
    cats.forEach(c=>{
      if(y > 280){ doc.addPage(); y = 20; }
      doc.text(`${c.label} (${c.qty}x)`, marginX, y);
      doc.text(brl(c.total), 180, y, {align:'right'});
      y += 6;
    });
    y += 4;
    doc.setFont('helvetica','bold'); doc.text('Vendas', marginX, y); y+=7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const ordered = summary.sales.slice().reverse();
    if(!ordered.length){ doc.text('Nenhuma venda registrada.', marginX, y); y+=6; }
    ordered.forEach(s=>{
      if(y > 280){ doc.addPage(); y = 20; }
      const time = new Date(s.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      doc.text(`${time}  ${s.qty}x ${s.name} (${s.method})`, marginX, y);
      doc.text(brl(s.price*s.qty), 180, y, {align:'right'});
      y += 6;
    });
    const fileDate = summary.dateLabel.split('/').reverse().join('-');
    doc.save(`fechamento-caixa-${fileDate}.pdf`);
  }catch(e){
    toast('Não consegui gerar o PDF agora.');
  }
}

function bindPhotoInput(){
  const input = document.getElementById('photoInput');
  if(!input) return;
  input.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      photoDataUrl = await resizeImage(file);
      render();
    }catch(err){ toast('Não consegui processar a foto.'); }
  });
}

function resizeImage(file, maxW=500, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- event delegation ---------------- */
document.addEventListener('click', async (e)=>{
  const viewBtn = e.target.closest('[data-view]');
  if(viewBtn && viewBtn.closest('.view-toggle')){
    currentView = viewBtn.dataset.view;
    pinError=false;
    render();
    return;
  }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='editName'){ showNameEdit=true; render(); return; }
  if(action==='cancelName'){ showNameEdit=false; render(); return; }
  if(action==='modalBgClickName' && !e.target.closest('[data-stop]')){ showNameEdit=false; render(); return; }
  if(action==='saveName'){
    const val = document.getElementById('storeNameInput').value.trim();
    if(val){ store.settings.name = val; await saveStore(); }
    showNameEdit=false; render();
    return;
  }

  if(action==='filter'){ lojaFilter = el.dataset.cat; render(); return; }
  if(action==='goCaixa'){ currentView='caixa'; render(); return; }

  /* ---- carrinho do cliente / checkout ---- */
  if(action==='none'){ return; }
  if(action==='custInc'){
    const p = store.products.find(pr=>pr.id===el.dataset.id);
    const inCart = custCart.find(c=>c.productId===el.dataset.id);
    const already = inCart ? inCart.qty : 0;
    const cur = custDraftQty[el.dataset.id] || 1;
    if(p && cur < (p.qty-already)) custDraftQty[el.dataset.id] = cur+1;
    render();
    return;
  }
  if(action==='custDec'){
    const cur = custDraftQty[el.dataset.id] || 1;
    custDraftQty[el.dataset.id] = Math.max(1, cur-1);
    render();
    return;
  }
  if(action==='custAdd'){
    const p = store.products.find(pr=>pr.id===el.dataset.id);
    if(!p) return;
    const dq = custDraftQty[el.dataset.id] || 1;
    const existing = custCart.find(c=>c.productId===p.id);
    if(existing) existing.qty += dq;
    else custCart.push({productId:p.id, name:p.name, category:p.category, price:p.price, qty:dq});
    custDraftQty[el.dataset.id] = 1;
    render();
    toast('Adicionado ao pedido!');
    return;
  }
  if(action==='custRemove'){
    custCart = custCart.filter(c=>c.productId!==el.dataset.id);
    render();
    return;
  }
  if(action==='setCustCirculo'){ custCirculo = el.dataset.circulo; render(); return; }
  if(action==='openCart'){ checkoutStep='cart'; render(); return; }
  if(action==='closeCheckout'){ checkoutStep=null; render(); return; }
  if(action==='goPay'){
    if(!custCart.length) return;
    if(!custCirculo){ toast('Escolha o círculo antes de continuar.'); return; }
    checkoutStep='pay'; render();
    return;
  }
  if(action==='backToCart'){ checkoutStep='cart'; render(); return; }
  if(action==='setCheckoutMethod'){ checkoutMethod = el.dataset.m; render(); return; }
  if(action==='setParcelas'){ checkoutParcelas = parseInt(el.dataset.n,10) || 1; render(); return; }
  if(action==='confirmPayment'){
    if(!MP_CHECKOUT_ENDPOINT && (checkoutMethod==='credito' || checkoutMethod==='debito')){
      const nome = (document.getElementById('cardNome')||{}).value?.trim() || '';
      const num = (document.getElementById('cardNum')||{}).value?.replace(/\s/g,'') || '';
      const val = (document.getElementById('cardVal')||{}).value?.trim() || '';
      const cvv = (document.getElementById('cardCvv')||{}).value?.trim() || '';
      if(!nome || num.length<13 || !/^\d{2}\/\d{2}$/.test(val) || cvv.length<3){
        toast('Confira os dados do cartão.');
        return;
      }
    }
    if(!custCart.length){ checkoutStep=null; render(); return; }
    // recarrega o estoque mais recente antes de confirmar (pode ter mudado)
    const fresh = await loadStore();
    store = fresh;
    const orderItems = [];
    for(const c of custCart){
      const p = store.products.find(pr=>pr.id===c.productId);
      if(!p) continue;
      const qty = Math.min(c.qty, p.qty);
      if(qty<=0) continue;
      p.qty -= qty;
      orderItems.push({productId:p.id, name:c.name, category:c.category, price:c.price, qty});
    }
    if(!orderItems.length){
      toast('Esses itens ficaram indisponíveis. Ajuste seu pedido.');
      checkoutStep='cart'; render();
      return;
    }
    const total = orderItems.reduce((a,it)=>a+it.price*it.qty,0);
    const order = {
      id: genId(),
      code: 'P-'+Math.random().toString(36).slice(2,6).toUpperCase(),
      items: orderItems,
      total,
      method: checkoutMethod,
      parcelas: checkoutMethod==='credito' ? checkoutParcelas : null,
      circulo: custCirculo,
      // com Mercado Pago configurado, o pedido só vira "pendente" (pago,
      // aguardando retirada) quando o webhook confirmar o pagamento
      status: MP_CHECKOUT_ENDPOINT ? 'aguardando_pagamento' : 'pendente',
      createdAt: Date.now(),
      pickedUpAt: null
    };
    store.orders = store.orders || [];
    store.orders.push(order);
    await saveStore();
    lastOrder = order;
    custCart = [];
    custDraftQty = {};
    custCirculo = null;

    if(MP_CHECKOUT_ENDPOINT){
      checkoutStep = 'redirecting'; render();
      try{
        const res = await fetch(MP_CHECKOUT_ENDPOINT, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            orderId: order.id,
            orderCode: order.code,
            total: order.total,
            method: order.method,
            parcelas: order.parcelas,
            items: order.items.map(it=>({title:it.name, quantity:it.qty, unit_price:it.price}))
          })
        });
        const data = await res.json();
        if(data && data.init_point){
          window.location.href = data.init_point;
          return;
        }
        throw new Error('resposta sem init_point');
      }catch(err){
        toast('Não consegui abrir o pagamento do Mercado Pago agora.');
        checkoutStep = 'done'; render();
        return;
      }
    }

    checkoutStep = 'done';
    render();
    return;
  }
  if(action==='closeDone'){
    lastOrder = null;
    checkoutStep = null;
    render();
    return;
  }
  if(action==='viewPedidos'){ caixaSubView='pedidos'; render(); return; }
  if(action==='backFromPedidos'){ caixaSubView='dashboard'; render(); return; }
  if(action==='viewComandas'){ caixaSubView='comandas'; openComandaId=null; closingComandaId=null; novaComandaCirculo=null; render(); return; }
  if(action==='backFromComandas'){ caixaSubView='dashboard'; openComandaId=null; closingComandaId=null; render(); return; }
  if(action==='markPickedUp'){
    const o = (store.orders||[]).find(x=>x.id===el.dataset.id);
    if(o && o.status==='pendente'){
      o.status = 'retirado';
      o.pickedUpAt = Date.now();
      const ts = Date.now();
      o.items.forEach(it=>{
        store.sales.push({id:genId(), ts, productId:it.productId, name:it.name, category:it.category, price:it.price, qty:it.qty, method:o.method, circulo:o.circulo||null});
      });
      await saveStore(); render();
      toast('Pedido entregue!');
    }
    return;
  }

  if(action==='enableNotifications'){
    try{
      if('Notification' in window){
        const perm = await Notification.requestPermission();
        if(perm==='granted') toast('Avisos ativados! Você vai ser avisado de novos pedidos.');
        else toast('Avisos não liberados. Você ainda verá o aviso na tela e vai ouvir o som.');
      }
    }catch(e){ /* navegador sem suporte */ }
    render();
    return;
  }
  if(action==='setNovaComandaCirculo'){ novaComandaCirculo = el.dataset.circulo; render(); return; }
  if(action==='novaComanda'){
    const inputEl = document.getElementById('novaComandaNomeInput');
    const nome = (inputEl?.value || '').trim();
    if(!novaComandaCirculo){ toast('Escolha o círculo antes de abrir a comanda.'); return; }
    if(!nome){ toast('Digite o nome da pessoa.'); return; }
    store.comandas = store.comandas || [];
    const c = {id:genId(), name:nome, items:[], status:'aberta', createdAt:Date.now(), closedAt:null, method:null, circulo:novaComandaCirculo};
    store.comandas.push(c);
    openComandaId = c.id;
    novaComandaCirculo = null;
    await saveStore(); render();
    return;
  }
  if(action==='deleteComanda'){
    const c = (store.comandas||[]).find(x=>x.id===el.dataset.id);
    if(c && !c.items.length){
      store.comandas = store.comandas.filter(x=>x.id!==c.id);
      await saveStore(); render();
    }
    return;
  }
  if(action==='toggleComandaPicker'){
    openComandaId = (openComandaId===el.dataset.id) ? null : el.dataset.id;
    comandaAddQty = {};
    render();
    return;
  }
  if(action==='incComandaQty'){
    const p = store.products.find(pr=>pr.id===el.dataset.id);
    const cur = comandaAddQty[el.dataset.id] || 1;
    if(p && cur < p.qty) comandaAddQty[el.dataset.id] = cur+1;
    render();
    return;
  }
  if(action==='decComandaQty'){
    const cur = comandaAddQty[el.dataset.id] || 1;
    comandaAddQty[el.dataset.id] = Math.max(1, cur-1);
    render();
    return;
  }
  if(action==='addToComanda'){
    const c = (store.comandas||[]).find(x=>x.id===el.dataset.comanda);
    const p = store.products.find(pr=>pr.id===el.dataset.id);
    if(!c || !p) return;
    const qty = comandaAddQty[p.id] || 1;
    if(qty<=0 || qty>p.qty) return;
    p.qty -= qty;
    const existing = c.items.find(it=>it.productId===p.id);
    if(existing) existing.qty += qty;
    else c.items.push({productId:p.id, name:p.name, price:p.price, qty});
    comandaAddQty[p.id] = 1;
    await saveStore(); render();
    return;
  }
  if(action==='removeComandaItem'){
    const c = (store.comandas||[]).find(x=>x.id===el.dataset.comanda);
    if(!c) return;
    const item = c.items.find(it=>it.productId===el.dataset.id);
    if(!item) return;
    const p = store.products.find(pr=>pr.id===item.productId);
    if(p) p.qty += item.qty; // devolve pro estoque
    c.items = c.items.filter(it=>it.productId!==item.productId);
    await saveStore(); render();
    return;
  }
  if(action==='closeComandaStart'){
    const c = (store.comandas||[]).find(x=>x.id===el.dataset.id);
    if(!c || !c.items.length) return;
    closingComandaId = c.id;
    openComandaId = null;
    selectedCirculo = null;
    render();
    return;
  }
  if(action==='cancelCloseComanda'){ closingComandaId = null; render(); return; }
  if(action==='confirmCloseComanda'){
    const c = (store.comandas||[]).find(x=>x.id===el.dataset.id);
    if(!c || !c.items.length) return;
    const ts = Date.now();
    c.items.forEach(it=>{
      const p = store.products.find(pr=>pr.id===it.productId);
      store.sales.push({id:genId(), ts, productId:it.productId, name:it.name, category:p?p.category:'outros', price:it.price, qty:it.qty, method:selectedMethod, circulo:c.circulo});
    });
    c.status = 'fechada';
    c.closedAt = ts;
    c.method = selectedMethod;
    closingComandaId = null;
    await saveStore(); render();
    toast('Comanda fechada e venda registrada!');
    return;
  }

  if(action==='pinDigit'){
    if(pinInput.length < PIN.length){
      pinInput += el.dataset.n;
      pinError = false;
      if(pinInput.length===PIN.length){
        if(pinInput===PIN){ caixaAuthed=true; pinInput=''; render(); }
        else { pinError=true; pinInput=''; render(); }
        return;
      }
    }
    render();
    return;
  }
  if(action==='pinClear'){ pinInput=''; pinError=false; render(); return; }
  if(action==='pinBack'){ pinInput = pinInput.slice(0,-1); render(); return; }

  if(action==='abrirCaixa'){
    const val = parseFloat(document.getElementById('trocoInput').value) || 0;
    store.register.open = true;
    store.register.trocoInicial = val;
    store.register.openedAt = Date.now();
    await saveStore(); render();
    return;
  }
  if(action==='verFechamento'){ caixaSubView='closeSummary'; render(); return; }
  if(action==='cancelCloseSummary'){ caixaSubView='dashboard'; render(); return; }
  if(action==='downloadSessionPdf'){
    const sess = sessionSales();
    const summary = buildSummary(sess, store.register.trocoInicial, store.register.openedAt, Date.now());
    generatePdf(summary);
    return;
  }
  if(action==='confirmCloseCaixa'){
    const sess = sessionSales();
    const closedAt = Date.now();
    const summary = buildSummary(sess, store.register.trocoInicial, store.register.openedAt, closedAt);
    store.history = store.history || [];
    store.history.push({ id:genId(), ...summary });
    store.register.open = false;
    await saveStore();
    caixaSubView='dashboard';
    render();
    toast('Caixa fechado!');
    return;
  }
  if(action==='viewHistory'){ caixaSubView='history'; render(); return; }
  if(action==='backFromHistory'){ caixaSubView='dashboard'; render(); return; }
  if(action==='downloadHistoryPdf'){
    const h = (store.history||[]).find(x=>x.id===el.dataset.id);
    if(h) generatePdf(h);
    return;
  }

  if(action==='fecharCaixa'){
    store.register.open = false;
    await saveStore(); render();
    return;
  }
  if(action==='setMethod'){ selectedMethod = el.dataset.m; render(); return; }
  if(action==='setCirculo'){ selectedCirculo = el.dataset.circulo; render(); return; }

  if(action==='incQty'){
    const p = store.products.find(pr=>pr.id===el.dataset.id);
    const inCart = cart.find(c=>c.productId===el.dataset.id);
    const already = inCart ? inCart.qty : 0;
    const cur = draftQty[el.dataset.id] || 1;
    if(p && cur < (p.qty-already)) draftQty[el.dataset.id] = cur+1;
    render();
    return;
  }
  if(action==='decQty'){
    const cur = draftQty[el.dataset.id] || 1;
    draftQty[el.dataset.id] = Math.max(1, cur-1);
    render();
    return;
  }
  if(action==='addToCart'){
    const p = store.products.find(pr=>pr.id===el.dataset.id);
    if(!p) return;
    const dq = draftQty[el.dataset.id] || 1;
    const existing = cart.find(c=>c.productId===p.id);
    if(existing) existing.qty += dq;
    else cart.push({productId:p.id, name:p.name, price:p.price, qty:dq});
    draftQty[el.dataset.id] = 1;
    render();
    return;
  }
  if(action==='removeCartItem'){
    cart = cart.filter(c=>c.productId!==el.dataset.id);
    render();
    return;
  }
  if(action==='finalizeSale'){
    if(!cart.length) return;
    if(!selectedCirculo){ toast('Escolha o círculo do comprador antes de finalizar.'); return; }
    const ts = Date.now();
    for(const item of cart){
      const p = store.products.find(pr=>pr.id===item.productId);
      if(!p) continue;
      const qty = Math.min(item.qty, p.qty);
      if(qty<=0) continue;
      p.qty -= qty;
      store.sales.push({id:genId(), ts, productId:p.id, name:p.name, category:p.category, price:p.price, qty, method:selectedMethod, circulo:selectedCirculo});
    }
    cart = [];
    await saveStore(); render();
    toast('Venda registrada!');
    return;
  }
  if(action==='undoLast'){
    const sess = sessionSales();
    if(sess.length){
      const last = sess[sess.length-1];
      const idx = store.sales.findIndex(s=>s.id===last.id);
      if(idx>-1) store.sales.splice(idx,1);
      const p = store.products.find(pr=>pr.id===last.productId);
      if(p) p.qty += last.qty;
      await saveStore(); render();
    }
    return;
  }

  if(action==='newProduct'){ editingProductId=null; photoDataUrl=null; caixaSubView='productForm'; render(); return; }
  if(action==='editProduct'){ editingProductId=el.dataset.id; photoDataUrl=null; caixaSubView='productForm'; render(); return; }
  if(action==='cancelProduct'){ caixaSubView='dashboard'; editingProductId=null; photoDataUrl=null; render(); return; }

  if(action==='saveProduct'){
    const name = document.getElementById('fName').value.trim();
    const category = document.getElementById('fCategory').value;
    const price = parseFloat(document.getElementById('fPrice').value);
    const qty = parseInt(document.getElementById('fQty').value);
    if(!name || isNaN(price) || price<0 || isNaN(qty) || qty<0){
      toast('Preencha nome, preço e quantidade corretamente.');
      return;
    }
    if(editingProductId){
      const p = store.products.find(pr=>pr.id===editingProductId);
      p.name=name; p.category=category; p.price=price; p.qty=qty;
      if(photoDataUrl) p.image = photoDataUrl;
    } else {
      store.products.push({id:genId(), name, category, price, qty, image:photoDataUrl||null});
    }
    caixaSubView='dashboard'; editingProductId=null; photoDataUrl=null;
    await saveStore(); render();
    toast('Produto salvo!');
    return;
  }

  if(action==='deleteProduct'){
    if(deleteConfirmId===el.dataset.id){
      store.products = store.products.filter(p=>p.id!==el.dataset.id);
      deleteConfirmId=null;
      await saveStore(); render();
      toast('Produto excluído.');
    } else {
      deleteConfirmId = el.dataset.id;
      render();
    }
    return;
  }
});

/* ---------------- init ---------------- */
(async function init(){
  store = await loadStore();
  // marca os pedidos já existentes como "conhecidos" pra não avisar sobre coisa antiga
  (store.orders||[]).forEach(o=>knownOrderStatus.set(o.id, o.status));
  render();
  setInterval(async ()=>{
    // pausa a sincronização enquanto a pessoa está digitando em um formulário
    if(checkoutStep==='pay' || checkoutStep==='redirecting') return;
    if(caixaSubView==='productForm') return;
    if(showNameEdit) return;
    try{
      const fresh = await loadStore();
      if(JSON.stringify(fresh)!==JSON.stringify(store)){
        (fresh.orders||[]).forEach(o=>{
          const prevStatus = knownOrderStatus.get(o.id);
          if(prevStatus===undefined){
            knownOrderStatus.set(o.id, o.status);
            if(caixaAuthed) notifyOwner('🛒 Novo pedido recebido!', `${o.code} · ${brl(o.total)}`);
          } else if(prevStatus!==o.status){
            knownOrderStatus.set(o.id, o.status);
            if(caixaAuthed && o.status==='pendente' && prevStatus==='aguardando_pagamento'){
              notifyOwner('✅ Pagamento confirmado', `${o.code} está pago, aguardando retirada`);
            }
          }
        });
        store = fresh;
        render();
      }
    }catch(e){ /* ignora falha silenciosa de sincronização */ }
  }, 5000);
})();
</script>
